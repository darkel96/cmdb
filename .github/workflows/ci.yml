# Prüft jeden Pull Request und jeden Push auf main: Typen, Builds (Dienst, Frontend, Pages) und E2E-Tests im Testmodus.
name: Prüfung

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Fertiges Playwright-Abbild (Browser und Systempakete schon drin, Version wie @playwright/test): kein apt-get bei
    # jedem Lauf, also keine Abhängigkeit von den Ubuntu-Paketservern; lokal wird genauso getestet
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:pages
      - run: npm run build && npm run build:server
      - run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-ergebnisse
          path: test-results
          retention-days: 7
